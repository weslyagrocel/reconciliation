<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFID Receipt Reconciliation</title>
<style>
:root{--navy:#1F3864;--blue:#2E75B6;--bg:#F4F6FA;--card:#fff;--line:#DDE3EC;--ink:#1c2433;--mut:#6b778c;--bad:#9C0006;--badbg:#F8CBAD;--warn:#7F6000;--warnbg:#FFE699;--ok:#375623;--okbg:#C6E0B4;--infobg:#DDEBF7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:baseline;gap:14px}
header h1{margin:0;font-size:18px;font-weight:600}header span{opacity:.75;font-size:13px}
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;padding:18px 24px;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
#side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3{margin:0 0 10px;font-size:14px}
.n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px}
.drop{display:flex;flex-direction:column;gap:2px;border:2px dashed #B8C4D6;border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:#FAFBFD}
.drop:hover,.drop.over{border-color:var(--blue);background:#EEF4FB}.drop b{font-size:13px;word-break:break-all}.drop span,.drop em{color:var(--mut);font-size:12px;font-style:normal}.drop.small{padding:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);margin-bottom:10px}
.fld.inl{margin:0;flex-direction:row;align-items:center;gap:8px}
input,select,button{font:inherit}
input[type=date],input[type=number],input[type=search],input:not([type]),select{border:1px solid #C4CEDC;border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;margin:-2px 0 12px;flex-wrap:wrap}
button{border:1px solid #C4CEDC;background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.4;cursor:default}
button.primary,#m-ok{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;padding:8px 14px}button.primary:hover{background:var(--blue);color:#fff}
button.btn-cycle{background:#0F7677;border-color:#0F7677;color:#fff;font-weight:600;padding:8px 14px}button.btn-cycle:hover{background:#0B5D5E;border-color:#0B5D5E;color:#fff}
button.btn-bill{background:#C55A11;border-color:#C55A11;color:#fff;font-weight:600;padding:8px 14px}button.btn-bill:hover{background:#9C4609;border-color:#9C4609;color:#fff}
.seg{display:flex;flex-direction:column;gap:5px}.seg label{display:flex;gap:7px;align-items:center;border:1px solid #C4CEDC;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink);font-size:13px}.seg label.on{border-color:var(--navy);background:#EEF4FB;font-weight:600}.seg small{color:var(--mut);font-weight:400}.seg input{margin:0}
.gapwarn{background:#FFF2CC;color:#7F6000;border-radius:6px;padding:4px 7px;margin-top:5px;font-size:11.5px}
.flist{margin-top:5px}.flist summary{cursor:pointer;color:var(--blue);font-size:12px}.flist ul{list-style:none;margin:4px 0 0;padding:0;max-height:170px;overflow:auto}.flist li{display:flex;gap:6px;align-items:center;font-size:11.5px;padding:2px 0;border-bottom:1px dashed var(--line)}.flist li span{flex:1;word-break:break-all;color:var(--ink)}.flist li em{color:var(--mut);font-style:normal;white-space:nowrap}.flist .x{padding:0 5px;font-size:11px;border-color:transparent;color:#9C0006}
.stbar i.info,.dot.info{background:#9DC3E6}.bdg.info{background:#DDEBF7;color:#1F3864}
button.mini{padding:1px 6px;font-size:12px}.sec{background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid #C4CEDC;border-radius:99px;padding:3px 10px;cursor:pointer;color:var(--ink);font-size:12px}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip input{display:none}
.hint{color:var(--mut);font-size:12px;margin:4px 0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:7px 0}.chk input{margin-top:3px}
.cust{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px}.cust.sel{border-color:#9DB6D8;background:#F7FAFE}
.ctop{display:flex;gap:9px;align-items:center;cursor:pointer}.cname{flex:1;font-weight:600;font-size:13px}.cname small{display:block;font-weight:400;color:var(--mut);font-size:11px}.cnt{font-size:11px;color:var(--mut);text-align:right}
.file{margin-top:8px;display:flex;justify-content:space-between;gap:8px;font-size:12px;align-items:flex-start}.file span{display:block;color:var(--mut)}.file b{word-break:break-all}.fb{display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap}.lnk{color:var(--blue);cursor:pointer;font-size:12px}
.cust .drop{margin-top:8px}.inw{margin-top:8px;font-size:12px;color:#375623;background:#E2EFDA;border-radius:6px;padding:5px 8px}.msel{margin:8px 0 0}
main{min-width:0}
.empty{background:var(--card);border:1px dashed #B8C4D6;border-radius:10px;padding:44px 30px;text-align:center;color:var(--mut)}.empty h2{color:var(--ink);margin:0 0 8px}.empty p{max-width:560px;margin:6px auto}
.tabs{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.tab{border-radius:8px 8px 0 0;padding:8px 14px;font-weight:600}.tab small{display:block;font-weight:400;color:var(--mut);font-size:11px}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.tab.on small{color:#cfd9ea}
.note{background:var(--infobg);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}.note.warn{background:var(--warnbg);color:#5c4500}
.chead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}.chead h2{margin:0;font-size:20px}.chead p{margin:2px 0;color:var(--mut);font-size:13px}.chead-r{display:flex;gap:10px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}.kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}.kpi b{font-size:21px;color:var(--navy);font-variant-numeric:tabular-nums}.kpi em{font-style:normal;font-size:11px;color:var(--mut)}.kpi.loss b{color:#C00000}.kpi.warn b{color:#B45F06}
.stbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#e5e9f0;margin:4px 0 6px}.stbar i{display:block}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.bad{background:var(--badbg);color:var(--bad)}.warn{background:#F9E3C6;color:#8a4b00}.ok{background:#E2EFDA;color:#375623}.good{background:var(--okbg);color:var(--ok)}.pend{background:var(--warnbg);color:var(--warn)}.info{background:var(--infobg);color:var(--navy)}
.stbar i.warn{background:#F4B183}.stbar i.bad{background:#E8836A}.stbar i.ok{background:#A9D18E}.stbar i.good{background:#70AD47}.stbar i.pend{background:#FFD966}
.two{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:12px;margin-bottom:12px}@media(max-width:1250px){.two{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
.bridge td{padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px}.bridge td:last-child{text-align:right;font-variant-numeric:tabular-nums}.bridge .b td{font-weight:700}.bridge .loss td{color:#C00000;border-bottom:0}.bridge small{color:#C00000;font-weight:400}
.tt th,.tt td{padding:6px 6px;font-size:12.5px;border-bottom:1px solid var(--line);text-align:right}.tt th:first-child,.tt td:first-child{text-align:left}.tt th{color:var(--mut);font-weight:600;font-size:11px}.tt tbody tr[data-tr]{cursor:pointer}.tt tbody tr[data-tr]:hover,.tt tr.on{background:#EEF4FB}.tt tr.tot td{font-weight:700;background:#DDEBF7;border-bottom:0}
.lb{position:relative;height:18px;min-width:90px;background:#f0f3f8;border-radius:4px;overflow:hidden}.lb i{position:absolute;left:0;top:0;bottom:0;background:#F4B183}.lb span{position:relative;padding:0 6px;line-height:18px;font-size:12px}
.thead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.thead h3{margin:0}.thead input{max-width:260px;margin-left:auto}.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border-radius:99px;padding:3px 10px;font-size:12px}.fchip b{color:var(--mut);font-weight:600}.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}.fchip.on b{color:#cfd9ea}
.scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
.grid th{position:sticky;top:0;background:#EEF2F8;font-size:11.5px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;color:#33415c}.grid td{padding:5px 8px;border-bottom:1px solid #EDF0F5;font-size:12.5px;white-space:nowrap}.grid tr:hover td{background:#F7FAFE}.r{text-align:right!important;font-variant-numeric:tabular-nums}.neg{color:#C00000}.sortable{cursor:pointer}.sorted{color:var(--navy)}
tr.mm td{background:#FFF7F2}.bdg{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600}.tag{background:var(--warnbg);color:var(--warn);border-radius:50%;padding:0 5px;font-weight:700;cursor:help}
select.st{padding:2px 4px;font-size:12px;width:auto}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--mut)}
dialog{border:0;border-radius:12px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:640px;width:92vw}dialog::backdrop{background:rgba(20,30,50,.45)}.dlgbox{padding:20px}.dlgbox h3{margin:0 0 4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:10px}.dbtn{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;font-weight:600;color:var(--navy);z-index:50;backdrop-filter:blur(1px)}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;max-width:80vw;z-index:60}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:#9C0006}
</style>
</head>
<body>

<dialog id="dlg"></dialog><div id="busy"></div><div id="toast"></div>

<script>/* Builds the 10-day billing cycle Daily Dispatch & Receipt workbook per customer using XlsxLib.Writer */
(function (root) {
  'use strict';
  const X = (typeof XlsxLib !== 'undefined') ? XlsxLib : require('./xlsxlib.js');
  const C = (typeof Core !== 'undefined') ? Core : require('./core.js');

  const NAVY = 'FF002060';
  const TEAL = 'FF0F7677';
  const TEAL_LT = 'FFDCEEF0';
  const BLUE_LT = 'FFD9E2F3';
  const CYCLE_BG = 'FFEDF2F8';
  const TOT_BG = 'FFF2F5FA';
  const LAST_BG = 'FFFFF2CC';
  const SUB_BG = 'FFD5EAEB';
  const GRAND_BG = 'FFE8EDF5';
  const RED = 'FFC00000';
  const WHITE = 'FFFFFFFF';
  const GRID = 'FFD9E1EC';
  const FONT = 'Calibri';

  const FMT_INT = '#,##0;(#,##0);"-"';
  const FMT_MT = '#,##0.00;(#,##0.00);"-"';
  const FMT_DIFF = '#,##0.00;[Red](#,##0.00);"-"';
  const FMT_PCT = '0.00%;[Red]-0.00%;0.00%';
  const FMT_DATE = 'dd-mmm-yy';

  const MON_S = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MON_L = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const pad2 = (n) => String(n).padStart(2, '0');
  const utcDate = (y, m, d) => new Date(Date.UTC(y, m, d));
  const dateKey = (d) => d ? d.toISOString().slice(0, 10) : '';
  const sheetSafe = (n) => String(n).replace(/[\\\/?*\[\]:]/g, ' ').trim().slice(0, 31);
  const itemShort = (it) => String(it).replace(/\s+salt$/i, '').trim() || it;
  const itemOrder = (it) => { const k = ['Washed Salt', 'Raw Salt', 'Fine Salt'].indexOf(it); return k < 0 ? 50 : k; };
  const fitName = (base, suffix) => sheetSafe(base).slice(0, Math.max(1, 31 - suffix.length)).trim() + suffix;

  function buildCycles(fromDate, toDate) {
    if (!fromDate || !toDate) return [];
    const cycles = [];
    let y = fromDate.getUTCFullYear(), m = fromDate.getUTCMonth();
    const endY = toDate.getUTCFullYear(), endM = toDate.getUTCMonth();
    while (y < endY || (y === endY && m <= endM)) {
      const lastDay = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
      const defs = [
        { num: 1, d1: 1, d2: 10 },
        { num: 2, d1: 11, d2: 20 },
        { num: 3, d1: 21, d2: lastDay }
      ];
      for (const def of defs) {
        const cStart = utcDate(y, m, def.d1), cEnd = utcDate(y, m, def.d2);
        if (cEnd < fromDate || cStart > toDate) continue;
        const dStart = cStart < fromDate ? fromDate : cStart;
        const dEnd = cEnd > toDate ? toDate : cEnd;
        const days = [];
        for (let t = dStart.getTime(); t <= dEnd.getTime(); t += 86400000) days.push(new Date(t));
        const monS = MON_S[m], yy2 = String(y).slice(-2);
        cycles.push({
          headerLabel: `Cycle ${def.num} (${pad2(def.d1)}-${pad2(def.d2)} ${monS} ${y})`,
          subLabel: `Cycle ${def.num} Subtotal (${pad2(def.d1)}-${pad2(def.d2)} ${monS} ${yy2})`,
          days
        });
      }
      m++;
      if (m > 11) { m = 0; y++; }
    }
    return cycles;
  }

  function grandTotalLabel(fromDate, toDate) {
    if (!fromDate || !toDate) return 'Grand Total';
    const y1 = fromDate.getUTCFullYear(), m1 = fromDate.getUTCMonth();
    const y2 = toDate.getUTCFullYear(), m2 = toDate.getUTCMonth();
    if (y1 === y2 && m1 === m2) return `Grand Total (Cum - ${MON_L[m1]} ${y1})`;
    return `Grand Total (Cum - ${MON_S[m1]} ${y1} to ${MON_S[m2]} ${y2})`;
  }

  function sumRefs(colIdx, rowList) {
    const col = X.colLetter(colIdx);
    if (!rowList.length) return '0';
    if (rowList.length === 1) return `${col}${rowList[0]}`;
    return `SUM(${rowList.map(r => `${col}${r}`).join(',')})`;
  }

  function sumCols(colList, rowIdx) {
    if (!colList.length) return '0';
    if (colList.length === 1) return `${X.colLetter(colList[0])}${rowIdx}`;
    return `SUM(${colList.map(c => `${X.colLetter(c)}${rowIdx}`).join(',')})`;
  }

  function writeDailySheet(wb, sheetName, kind, rows, transporters, ctx, tabColor) {
    const isReceipt = kind === 'RECEIPT';

      if (dt < minD) minD = dt;
      if (dt > maxD) maxD = dt;
      const dk = dateKey(d);
      const k = dk + '\t' + r.transporter;
      const cur = agg.get(k) || { trucks: 0, wt: 0 };
      cur.trucks += 1;
      cur.wt += isReceipt ? r.rcvMT : r.dispMT;
      agg.set(k, cur);
    });

    const fromDate = isFinite(minD) ? new Date(minD) : ctx.from;
    const toDate = isFinite(maxD) ? new Date(maxD) : ctx.to;
    const cycles = buildCycles(fromDate, toDate);
    const lastDateKey = toDate ? dateKey(toDate) : '';

    const ws = wb.addSheet(sheetName, {
      freeze: { row: 4, col: 1 },
      showGridLines: false,
      tabColor: tabColor || (isReceipt ? TEAL : NAVY),
      landscape: true,
      zoom: 95
    });

    // Column widths
    ws.width(1, 30);
    for (let i = 0; i < T; i++) {
      ws.width(2 + i * 2, 14);
      ws.width(3 + i * 2, 18);
    }

    ws.height(4, 24);

    // Col A merged A2:A4
    const hdrNavy = {
      font: FONT, size: 11, bold: true, color: WHITE, fill: NAVY,

    const dtHdr = {
      font: FONT, size: 11, bold: true, color: WHITE, fill: NAVY,

      const cycTrk = new Array(T).fill(0);

      cyc.days.forEach(d => {

        ws.set(r, 1, d, {

          dayWt += v.wt;

          ws.set(r, c1, v.trucks, {

          });

            numFmt: FMT_MT, halign: 'right', valign: 'center',
            border: { right: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: GRID } }
          });
        }

        ws.set(r, totTrkCol, { f: sumCols(trkCols, r), v: dayTrk }, {
          font: FONT, size: 10.5, bold: true, color: NAVY, fill: totFill,
          numFmt: FMT_INT, halign: 'right', valign: 'center',
          border: { left: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: GRID } }
        });
        ws.set(r, totWtCol, { f: sumCols(wtCols, r), v: C.round(dayWt, 3) }, {
          font: FONT, size: 10.5, bold: true, color: NAVY, fill: totFill,
          numFmt: FMT_MT, halign: 'right', valign: 'center',
          border: { right: { style: 'thin', color: NAVY }, bottom: { style: 'thin', color: GRID } }
        });

        r++;
      });

      const lastDayRow = r - 1;

      // Cycle Subtotal row
      ws.height(r, 21);
      ws.set(r, 1, cyc.subLabel, {
        font: FONT, size: 10.5, bold: true, color: NAVY, fill: SUB_BG,
        halign: 'left', valign: 'center',
        border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL }, right: { style: 'thin', color: TEAL } }
      });

      let cycTotTrk = 0, cycTotWt = 0;
      for (let i = 0; i < T; i++) {
        const c1 = 2 + i * 2, c2 = 3 + i * 2;
        grandTrk[i] += cycTrk[i];
        grandWt[i] += cycWt[i];
        cycTotTrk += cycTrk[i];
        cycTotWt += cycWt[i];

        ws.set(r, c1, { f: `SUM(${X.colLetter(c1)}${firstDayRow}:${X.colLetter(c1)}${lastDayRow})`, v: cycTrk[i] }, {
          font: FONT, size: 10.5, bold: true, color: NAVY, fill: SUB_BG,

        });
        ws.set(r, c2, { f: `SUM(${X.colLetter(c2)}${firstDayRow}:${X.colLetter(c2)}${lastDayRow})`, v: C.round(cycWt[i], 3) }, {
          font: FONT, size: 10.5, bold: true, color: NAVY, fill: SUB_BG,
          numFmt: FMT_MT, halign: 'right', valign: 'center',
          border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL }, right: { style: 'thin', color: TEAL } }

      ws.set(r, totTrkCol, { f: `SUM(${X.colLetter(totTrkCol)}${firstDayRow}:${X.colLetter(totTrkCol)}${lastDayRow})`, v: cycTotTrk }, {
        font: FONT, size: 10.5, bold: true, color: NAVY, fill: SUB_BG,
        numFmt: FMT_INT, halign: 'right', valign: 'center',
        border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL }, left: { style: 'thin', color: TEAL } }
      });
      ws.set(r, totWtCol, { f: `SUM(${X.colLetter(totWtCol)}${firstDayRow}:${X.colLetter(totWtCol)}${lastDayRow})`, v: C.round(cycTotWt, 3) }, {
        font: FONT, size: 10.5, bold: true, color: NAVY, fill: SUB_BG,
        numFmt: FMT_MT, halign: 'right', valign: 'center',
        border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL }, right: { style: 'thin', color: NAVY } }
      });

      subRows.push(r);
      r++;
    });

    // Grand Total row
    ws.height(r, 24);
    ws.set(r, 1, grandTotalLabel(fromDate, toDate), {
      font: FONT, size: 11, bold: true, color: RED, fill: GRAND_BG,
      halign: 'left', valign: 'center',
      border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, right: { style: 'thin', color: TEAL } }
    });

    let allTrk = 0, allWt = 0;
    for (let i = 0; i < T; i++) {
      const c1 = 2 + i * 2, c2 = 3 + i * 2;
      allTrk += grandTrk[i];
      allWt += grandWt[i];
      ws.set(r, c1, { f: sumRefs(c1, subRows), v: grandTrk[i] }, {
        font: FONT, size: 11, bold: true, color: RED, fill: GRAND_BG,
        numFmt: FMT_INT, halign: 'right', valign: 'center',
        border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, left: { style: 'thin', color: TEAL } }
      });
      ws.set(r, c2, { f: sumRefs(c2, subRows), v: C.round(grandWt[i], 3) }, {
        font: FONT, size: 11, bold: true, color: RED, fill: GRAND_BG,
        numFmt: FMT_MT, halign: 'right', valign: 'center',
        border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, right: { style: 'thin', color: TEAL } }
      });
    }

    ws.set(r, totTrkCol, { f: sumRefs(totTrkCol, subRows), v: allTrk }, {
      font: FONT, size: 11, bold: true, color: RED, fill: GRAND_BG,
      numFmt: FMT_INT, halign: 'right', valign: 'center',
      border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, left: { style: 'thin', color: TEAL } }
    });
    ws.set(r, totWtCol, { f: sumRefs(totWtCol, subRows), v: C.round(allWt, 3) }, {
      font: FONT, size: 11, bold: true, color: RED, fill: GRAND_BG,
      numFmt: FMT_MT, halign: 'right', valign: 'center',
      border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, right: { style: 'thin', color: NAVY } }
    });

    return ws;
  }

  function writeComparisonSheet(wb, sheetName, rows, ctx) {
    const dispByDay = new Map(), rcvByDay = new Map();
    let minD = ctx.from ? ctx.from.getTime() : Infinity;
    let maxD = ctx.to ? ctx.to.getTime() : -Infinity;

    rows.forEach(r => {
      if (r.date) {
        const dt = r.date.getTime();
        if (dt < minD) minD = dt;
        if (dt > maxD) maxD = dt;
        const dk = dateKey(r.date);
        const cur = dispByDay.get(dk) || { trucks: 0, wt: 0 };
        cur.trucks += 1; cur.wt += r.dispMT;
        dispByDay.set(dk, cur);
      }
      if (r.rcvMT !== null) {
        const rd = r.rcvDate || r.date;
        if (rd) {
          const dt = rd.getTime();
          if (dt < minD) minD = dt;
          if (dt > maxD) maxD = dt;
          const dk = dateKey(rd);
          const cur = rcvByDay.get(dk) || { trucks: 0, wt: 0 };
          cur.trucks += 1; cur.wt += r.rcvMT;
          rcvByDay.set(dk, cur);
        }
      }
    });

    const fromDate = isFinite(minD) ? new Date(minD) : ctx.from;

    });
    ws.merge('A1:G1');

    ws.height(2, 24);
    ws.height(3, 24);

    for (let c = 2; c <= 5; c++) {

    const grpHdr = (c1, c2, label) => {

      ws.set(3, c2, null, { font: FONT, size: 10.5, bold: true, color: NAVY, fill: TEAL_LT, halign: 'center', valign: 'center', border: { right: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: WHITE } } });
      ws.merge(`${X.colLetter(c1)}3:${X.colLetter(c2)}3`);

      const sb = (o) => Object.assign({ font: FONT, size: 10.5, bold: true, color: NAVY, fill: SUB_BG, valign: 'center', border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL } } }, o || {});

      ws.set(r, 4, { f: `SUM(D${firstDayRow}:D${lastDayRow})`, v: cRT }, sb({ numFmt: FMT_INT, halign: 'right', border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL }, left: { style: 'thin', color: TEAL } } }));
      ws.set(r, 5, { f: `SUM(E${firstDayRow}:E${lastDayRow})`, v: C.round(cRW, 3) }, sb({ numFmt: FMT_MT, halign: 'right', border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL }, right: { style: 'thin', color: TEAL } } }));
      ws.set(r, 6, { f: `E${r}-C${r}`, v: C.round(cDiff, 3) }, sb({ numFmt: FMT_DIFF, halign: 'right', border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL }, left: { style: 'thin', color: TEAL } } }));
      ws.set(r, 7, { f: `IFERROR(F${r}/C${r},0)`, v: cPct }, sb({ numFmt: FMT_PCT, halign: 'right', border: { top: { style: 'thin', color: TEAL }, bottom: { style: 'thin', color: TEAL }, right: { style: 'thin', color: NAVY } } }));
      subRows.push(r);
      r++;
    });

    // Grand Total
    ws.height(r, 24);
    const gDiff = gRW - gDW, gPct = gDW ? gDiff / gDW : 0;
    const gb = (o) => Object.assign({ font: FONT, size: 11, bold: true, color: RED, fill: GRAND_BG, valign: 'center' }, o || {});
    ws.set(r, 1, grandTotalLabel(fromDate, toDate), gb({ halign: 'left', border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, right: { style: 'thin', color: TEAL } } }));
    ws.set(r, 2, { f: sumRefs(2, subRows), v: gDT }, gb({ numFmt: FMT_INT, halign: 'right', border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, left: { style: 'thin', color: TEAL } } }));
    ws.set(r, 3, { f: sumRefs(3, subRows), v: C.round(gDW, 3) }, gb({ numFmt: FMT_MT, halign: 'right', border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, right: { style: 'thin', color: TEAL } } }));
    ws.set(r, 4, { f: sumRefs(4, subRows), v: gRT }, gb({ numFmt: FMT_INT, halign: 'right', border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, left: { style: 'thin', color: TEAL } } }));
    ws.set(r, 5, { f: sumRefs(5, subRows), v: C.round(gRW, 3) }, gb({ numFmt: FMT_MT, halign: 'right', border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, right: { style: 'thin', color: TEAL } } }));
    ws.set(r, 6, { f: `E${r}-C${r}`, v: C.round(gDiff, 3) }, gb({ numFmt: FMT_DIFF, halign: 'right', border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, left: { style: 'thin', color: TEAL } } }));
    ws.set(r, 7, { f: `IFERROR(F${r}/C${r},0)`, v: gPct }, gb({ numFmt: FMT_PCT, halign: 'right', border: { top: { style: 'thin', color: NAVY }, bottom: { style: 'medium', color: NAVY }, right: { style: 'thin', color: NAVY } } }));
    return ws;
  }

  async function buildWorkbook(result, meta) {
    const rows = result.rows || [];
    const items = Array.from(new Set(rows.map(r => r.item))).sort((a, b) => itemOrder(a) - itemOrder(b) || (a < b ? -1 : 1));
    if (!items.length) items.push(meta.itemLabel || 'Salt');
    const multi = items.length > 1;
    const baseCtx = Object.assign({}, meta, { customerShort: C.customerShort(result.customer) });

    const wb = new X.Writer();
    items.forEach(item => {
      const rs = multi ? rows.filter(r => r.item === item) : rows;
      const transporters = Array.from(new Set(rs.map(r => r.transporter))).sort();
      const ctx = Object.assign({}, baseCtx, { itemLabel: item });
      const dispName = multi ? fitName('Dispatch', ` - ${itemShort(item)}`) : 'Daily Dispatch';
      const rcvName = multi ? fitName('Receipt', ` - ${itemShort(item)}`) : 'Daily Receipt';
      const cmpName = multi ? fitName('Disp vs Rcv', ` - ${itemShort(item)}`) : 'Dispatch vs Receipt';
      writeDailySheet(wb, dispName, 'DISPATCH', rs, transporters, ctx, NAVY);
      writeDailySheet(wb, rcvName, 'RECEIPT', rs, transporters, ctx, TEAL);
      writeComparisonSheet(wb, cmpName, rs, ctx);
    });

    return await wb.toUint8Array();
  }

  const api = { buildWorkbook };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.DailyCycleExport = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* Billing-cycle workbook: billing is on the RECEIPT date at the customer (1-10 / 11-20 / 21-month end).
   Trucks not received by the cycle end are listed as carry-forward and bill in the cycle in which receipt is confirmed. */
(function (root) {
  'use strict';
  const X = (typeof XlsxLib !== 'undefined') ? XlsxLib : require('./xlsxlib.js');
  const C = (typeof Core !== 'undefined') ? Core : require('./core.js');
  const NAVY = 'FF1F3864', TEAL = 'FF0F7677', LIGHT = 'FFDDEBF7', BAND = 'FFF2F2F2', GRID = 'FFBFBFBF', AMBER = 'FFFFF2CC', SUB = 'FFD5EAEB', GRAND = 'FFE8EDF5', RED = 'FFC00000', WHITE = 'FFFFFFFF', GREEN = 'FFE2EFDA';
  const A = 'Arial';
  const FMT = { int: '#,##0;(#,##0);"-"', mt: '#,##0.00;(#,##0.00);"-"', diff: '#,##0.00;[Red]\\(#,##0.00\\);"-"', pct: '0.00%;[Red]-0.00%;0.00%', date: 'dd\\-mmm\\-yy' };
  const DAY = 86400000;
  const sheetSafe = (n) => String(n).replace(/[\\\/?*\[\]:]/g, ' ').trim().slice(0, 31);

  // ---------- analysis ----------
  function analyse(res, meta) {
    const from = meta.from, to = meta.to, toT = to.getTime();
    const cycles = C.cyclesBetween(from, to).map(c => Object.assign({}, c, { effEnd: c.end.getTime() < toT ? c.end : to, inProgress: c.end.getTime() > toT }));
    const rows = res.rows.map(r => {
      const billable = r.rcvMT !== null;
      const rcvEff = r.rcvDateActual || (billable ? r.date : null);           // date on which the truck counts as received
      const dispC = C.cycleOf(r.date);
      const billC = rcvEff ? C.cycleOf(rcvEff) : null;                          // cycle in which it bills (may be after the period)
      return Object.assign({}, r, { billable, rcvEff, dispC, billC });
    });
    const carryAt = (r, e) => r.date.getTime() <= e.getTime() && (!r.rcvEff || r.rcvEff.getTime() > e.getTime());
    function pendingAt(r) {                                                      // cycle ends at which this truck was still not received
      const out = []; let c = r.dispC; const lastKey = C.cycleOf(to).key;
      for (let g = 0; g < 80; g++) {
        const e = c.end.getTime() < toT ? c.end : to;
        if (carryAt(r, e)) out.push({ c, e, partial: c.end.getTime() > toT }); else if (r.rcvEff && r.rcvEff.getTime() <= e.getTime()) break;
        if (c.key === lastKey) break;
        c = C.cycleOf(new Date(c.end.getTime() + DAY));
      }
      return out;
    }
    const sum = (a, f) => a.reduce((s, r) => s + f(r), 0);
    const perCycle = cycles.map(c => {
      const bill = rows.filter(r => r.billable && r.billC.key === c.key);
      const same = bill.filter(r => r.dispC.key === c.key);
      const dispIn = rows.filter(r => r.dispC.key === c.key);
      const carry = rows.filter(r => carryAt(r, c.effEnd));
      return { c, bill, same, dispIn, carry };
    });
    const carryList = rows.filter(r => !r.billable || r.billC.key !== r.dispC.key).map(r => Object.assign({}, r, { pend: pendingAt(r) }));
    return { cycles, rows, perCycle, carryList, sum };
  }

  // ---------- helpers ----------
  const hdrStyle = { bold: true, color: WHITE, fill: NAVY, halign: 'center', valign: 'center', wrap: true, border: 'thin', borderColor: GRID, font: A, size: 10 };
  function head(ws, r, labels, widths) { labels.forEach((h, i) => { ws.set(r, i + 1, h, hdrStyle); if (widths) ws.width(i + 1, widths[i]); }); ws.height(r, 33); }
  const bs = (o) => Object.assign({ border: 'thin', borderColor: GRID, halign: 'center', font: A, size: 10 }, o || {});
  function title(ws, a, ctx, sub) {
    ws.set(1, 1, `${ctx.customerShort} – ${ctx.plantLabel} | ${ctx.itemLabel} | ${sub}`, { bold: true, size: 12, font: A, color: RED });
    ws.set(2, 1, `Billing period (receipt date at ${ctx.agent}): ${C.fmtDate(ctx.from)} to ${C.fmtDate(ctx.to)}   |   Cycles: 1-10, 11-20, 21-month end   |   Basis: trucks received at customer end`, { size: 10, font: A });
  }

  // ---------- sheet 1: cycle summary ----------
  function sheetSummary(wb, an, ctx) {
    const ws = wb.addSheet('Cycle Summary', { freeze: { row: 4, col: 1 }, showGridLines: false, tabColor: NAVY, zoom: 90 });
    title(ws, an, ctx, 'Billing Cycle Summary (by receipt date)');
    const H = ['Billing cycle (receipt date)', 'Cycle status', 'Trucks received (billable)', '…of which dispatched in same cycle', '…of which brought forward from earlier cycle', 'Dispatched Wt of received trucks (MT)', `Received Wt at ${ctx.agent} (MT)`, 'Transit loss (MT)', 'Loss %', 'Trucks dispatched in cycle', 'Dispatched in cycle (MT)', 'Carry-forward at cycle end (trucks)', 'Carry-forward at cycle end (MT)'];
    head(ws, 4, H, [34, 14, 14, 16, 18, 18, 18, 14, 10, 14, 16, 16, 16]);
    let r = 5; const first = r;
    an.perCycle.forEach(p => {
      const dispMT = an.sum(p.bill, x => x.dispMT), rcvMT = an.sum(p.bill, x => x.rcvMT);
      ws.set(r, 1, p.c.label, bs({ halign: 'left', bold: true }));
      ws.set(r, 2, p.c.inProgress ? `In progress (data to ${C.fmtDate(p.c.effEnd)})` : 'Closed', bs({ fill: p.c.inProgress ? AMBER : null, wrap: true }));
      ws.set(r, 3, p.bill.length, bs({ numFmt: FMT.int, bold: true }));
      ws.set(r, 4, p.same.length, bs({ numFmt: FMT.int }));
      ws.set(r, 5, { f: `C${r}-D${r}`, v: p.bill.length - p.same.length }, bs({ numFmt: FMT.int }));
      ws.set(r, 6, C.round(dispMT, 3), bs({ numFmt: FMT.mt }));
      ws.set(r, 7, C.round(rcvMT, 3), bs({ numFmt: FMT.mt }));
      ws.set(r, 8, { f: `F${r}-G${r}`, v: C.round(dispMT - rcvMT, 3) }, bs({ numFmt: FMT.mt, fill: LIGHT }));
      ws.set(r, 9, { f: `IFERROR(H${r}/F${r},0)`, v: dispMT ? (dispMT - rcvMT) / dispMT : 0 }, bs({ numFmt: FMT.pct, fill: LIGHT }));
      ws.set(r, 10, p.dispIn.length, bs({ numFmt: FMT.int }));
      ws.set(r, 11, C.round(an.sum(p.dispIn, x => x.dispMT), 3), bs({ numFmt: FMT.mt }));
      ws.set(r, 12, p.carry.length, bs({ numFmt: FMT.int, fill: p.carry.length ? AMBER : null }));
      ws.set(r, 13, C.round(an.sum(p.carry, x => x.dispMT), 3), bs({ numFmt: FMT.mt, fill: p.carry.length ? AMBER : null }));
      ws.height(r, 22); r++;
    });
    const last = r - 1; const tb = (o) => bs(Object.assign({ bold: true, fill: GRAND, color: RED, size: 11 }, o || {}));
    ws.set(r, 1, 'Grand Total (billable in period)', tb({ halign: 'left' })); ws.set(r, 2, null, tb());
    [3, 4, 5, 10].forEach(c => { const L = X.colLetter(c); ws.set(r, c, { f: `SUM(${L}${first}:${L}${last})`, v: an.perCycle.reduce((s, p) => s + (c === 3 ? p.bill.length : c === 4 ? p.same.length : c === 5 ? p.bill.length - p.same.length : p.dispIn.length), 0) }, tb({ numFmt: FMT.int })); });
    [6, 7, 11].forEach(c => { const L = X.colLetter(c); ws.set(r, c, { f: `SUM(${L}${first}:${L}${last})`, v: C.round(an.perCycle.reduce((s, p) => s + (c === 6 ? an.sum(p.bill, x => x.dispMT) : c === 7 ? an.sum(p.bill, x => x.rcvMT) : an.sum(p.dispIn, x => x.dispMT)), 0), 3) }, tb({ numFmt: FMT.mt })); });
    const gD = an.perCycle.reduce((s, p) => s + an.sum(p.bill, x => x.dispMT), 0), gR = an.perCycle.reduce((s, p) => s + an.sum(p.bill, x => x.rcvMT), 0);
    ws.set(r, 8, { f: `F${r}-G${r}`, v: C.round(gD - gR, 3) }, tb({ numFmt: FMT.mt })); ws.set(r, 9, { f: `IFERROR(H${r}/F${r},0)`, v: gD ? (gD - gR) / gD : 0 }, tb({ numFmt: FMT.pct }));
    ws.set(r, 12, null, tb()); ws.set(r, 13, null, tb()); ws.height(r, 24);
    const notes = [
      'How to read this sheet',
      '•  A truck is billable in the cycle in which it is RECEIVED at the customer (receipt date), not the cycle in which it was dispatched.',
      '•  "Brought forward" = received in this cycle but dispatched in an earlier cycle (it was carry-forward at that earlier cycle end).',
      '•  "Carry-forward at cycle end" = trucks dispatched up to the cycle end that had not been received by then. They are listed truck-by-truck on the "Carry Forward Trucks" sheet and bill in the cycle of their receipt. The carry-forward columns are a closing position per cycle, so they are not added up.',
      '•  Dispatched Wt of received trucks = RFID net weight of exactly those trucks that were received in the cycle, so loss % compares like with like.'
    ];
    notes.forEach((t, i) => ws.set(r + 2 + i, 1, t, { font: A, size: 10, bold: i === 0, color: i === 0 ? NAVY : 'FF404040' }));
  }

  // ---------- sheet 2: transporter-wise ----------
  function sheetTransporter(wb, an, ctx) {
    const ws = wb.addSheet('Transporter-wise', { freeze: { row: 4, col: 2 }, showGridLines: false, tabColor: TEAL, zoom: 90 });
    title(ws, an, ctx, 'Transporter-wise billing by receipt date');
    head(ws, 4, ['Billing cycle (receipt date)', 'Transporter', 'Trucks received (billable)', 'Dispatched Wt of received trucks (MT)', `Received Wt at ${ctx.agent} (MT)`, 'Transit loss (MT)', 'Loss %', 'Carry-forward at cycle end (trucks)', 'Carry-forward at cycle end (MT)'], [34, 34, 14, 18, 18, 14, 10, 16, 16]);
    let r = 5; const subRows = [];
    let gT = 0, gD = 0, gR = 0;
    an.perCycle.forEach(p => {
      const names = Array.from(new Set(p.bill.map(x => x.transporter).concat(p.carry.map(x => x.transporter)))).sort();
      const first = r; let cT = 0, cD = 0, cR = 0;
      names.forEach(t => {
        const b = p.bill.filter(x => x.transporter === t), cf = p.carry.filter(x => x.transporter === t);
        const d = an.sum(b, x => x.dispMT), v = an.sum(b, x => x.rcvMT); cT += b.length; cD += d; cR += v;
        ws.set(r, 1, p.c.short + (p.c.inProgress ? ' (in progress)' : ''), bs({ halign: 'left' })); ws.set(r, 2, t, bs({ halign: 'left' }));
        ws.set(r, 3, b.length, bs({ numFmt: FMT.int })); ws.set(r, 4, C.round(d, 3), bs({ numFmt: FMT.mt })); ws.set(r, 5, C.round(v, 3), bs({ numFmt: FMT.mt }));
        ws.set(r, 6, { f: `D${r}-E${r}`, v: C.round(d - v, 3) }, bs({ numFmt: FMT.mt, fill: LIGHT })); ws.set(r, 7, { f: `IFERROR(F${r}/D${r},0)`, v: d ? (d - v) / d : 0 }, bs({ numFmt: FMT.pct, fill: LIGHT }));
        ws.set(r, 8, cf.length, bs({ numFmt: FMT.int, fill: cf.length ? AMBER : null })); ws.set(r, 9, C.round(an.sum(cf, x => x.dispMT), 3), bs({ numFmt: FMT.mt, fill: cf.length ? AMBER : null })); r++;
      });
      if (!names.length) { ws.set(r, 1, p.c.short, bs({ halign: 'left' })); ws.set(r, 2, '(no trucks)', bs({ halign: 'left' })); r++; }
      const last = r - 1; const sb = (o) => bs(Object.assign({ bold: true, fill: SUB, color: NAVY }, o || {}));
      ws.set(r, 1, `${p.c.label} – Subtotal`, sb({ halign: 'left' })); ws.set(r, 2, null, sb());
      ws.set(r, 3, { f: `SUM(C${first}:C${last})`, v: cT }, sb({ numFmt: FMT.int })); ws.set(r, 4, { f: `SUM(D${first}:D${last})`, v: C.round(cD, 3) }, sb({ numFmt: FMT.mt })); ws.set(r, 5, { f: `SUM(E${first}:E${last})`, v: C.round(cR, 3) }, sb({ numFmt: FMT.mt }));
      ws.set(r, 6, { f: `D${r}-E${r}`, v: C.round(cD - cR, 3) }, sb({ numFmt: FMT.mt })); ws.set(r, 7, { f: `IFERROR(F${r}/D${r},0)`, v: cD ? (cD - cR) / cD : 0 }, sb({ numFmt: FMT.pct }));
      ws.set(r, 8, { f: `SUM(H${first}:H${last})`, v: p.carry.length }, sb({ numFmt: FMT.int })); ws.set(r, 9, { f: `SUM(I${first}:I${last})`, v: C.round(an.sum(p.carry, x => x.dispMT), 3) }, sb({ numFmt: FMT.mt }));
      subRows.push(r); gT += cT; gD += cD; gR += cR; r++;
    });
    const gb = (o) => bs(Object.assign({ bold: true, fill: GRAND, color: RED, size: 11 }, o || {}));
    const ref = (L) => subRows.length === 1 ? `${L}${subRows[0]}` : `SUM(${subRows.map(x => L + x).join(',')})`;
    ws.set(r, 1, 'Grand Total (billable in period)', gb({ halign: 'left' })); ws.set(r, 2, null, gb());
    ws.set(r, 3, { f: ref('C'), v: gT }, gb({ numFmt: FMT.int })); ws.set(r, 4, { f: ref('D'), v: C.round(gD, 3) }, gb({ numFmt: FMT.mt })); ws.set(r, 5, { f: ref('E'), v: C.round(gR, 3) }, gb({ numFmt: FMT.mt }));
    ws.set(r, 6, { f: `D${r}-E${r}`, v: C.round(gD - gR, 3) }, gb({ numFmt: FMT.mt })); ws.set(r, 7, { f: `IFERROR(F${r}/D${r},0)`, v: gD ? (gD - gR) / gD : 0 }, gb({ numFmt: FMT.pct }));
    ws.set(r, 8, null, gb()); ws.set(r, 9, null, gb());
  }

  // ---------- sheet 3: billable trucks ----------
  function sheetBillable(wb, an, ctx) {
    const ws = wb.addSheet('Billable Trucks', { freeze: { row: 4, col: 2 }, showGridLines: false, tabColor: 'FF2E75B6', zoom: 90 });
    title(ws, an, ctx, 'Trucks received in the period – billable');
    const H = ['Billing cycle (receipt date)', 'Weighment Slip No', 'Receipt Date', 'Dispatch Date', 'Transporter', 'Dispatch Truck No', `${ctx.agent} Truck No`, 'Truck No Check', 'Dispatched (MT)', 'Received (MT)', 'Diff (MT)', 'Diff %', 'Status', 'Dispatched in cycle', 'Brought forward?', 'Remark'];
    head(ws, 4, H, [30, 19, 12, 12, 30, 16, 16, 12, 13, 13, 12, 10, 14, 30, 12, 40]);
    const list = an.rows.filter(x => x.billable).sort((a, b) => a.billC.start - b.billC.start || (a.rcvEff - b.rcvEff) || a.date - b.date || a.key.localeCompare(b.key));
    list.forEach((x, i) => {
      const r = 5 + i, band = i % 2 ? BAND : null, b = (o) => bs(Object.assign({ fill: band }, o || {}));
      const bf = x.billC.key !== x.dispC.key;
      ws.set(r, 1, x.billC.label, b({ halign: 'left' })); ws.set(r, 2, x.slip, b()); ws.set(r, 3, x.rcvEff, b({ numFmt: FMT.date })); ws.set(r, 4, x.date, b({ numFmt: FMT.date }));
      ws.set(r, 5, x.transporter, b({ halign: 'left' })); ws.set(r, 6, x.truckRFID, b()); ws.set(r, 7, x.truckRcv || null, b()); ws.set(r, 8, x.truckCheck, b({ fill: x.truckCheck === 'Mismatch' ? 'FFF8CBAD' : band }));
      ws.set(r, 9, C.round(x.dispMT, 3), b({ numFmt: FMT.mt })); ws.set(r, 10, C.round(x.rcvMT, 3), b({ numFmt: FMT.mt }));
      ws.set(r, 11, { f: `J${r}-I${r}`, v: C.round(x.rcvMT - x.dispMT, 3) }, b({ numFmt: FMT.diff })); ws.set(r, 12, { f: `IFERROR(K${r}/I${r},0)`, v: x.dispMT ? (x.rcvMT - x.dispMT) / x.dispMT : 0 }, b({ numFmt: FMT.pct }));
      ws.set(r, 13, x.status, b()); ws.set(r, 14, x.dispC.short, b({ halign: 'left' })); ws.set(r, 15, bf ? 'Yes' : 'No', b({ fill: bf ? AMBER : band })); ws.set(r, 16, x.remark || null, b({ halign: 'left' }));
    });
    const last = 4 + list.length, t = last + 1, tb = (o) => bs(Object.assign({ bold: true, fill: GRAND, color: RED }, o || {}));
    ws.set(t, 1, 'Total', tb({ halign: 'left' })); for (let c = 2; c <= 16; c++) ws.set(t, c, null, tb());
    ws.set(t, 2, { f: `COUNTA(B5:B${last})`, v: list.length }, tb({ numFmt: FMT.int }));
    const dS = an.sum(list, x => x.dispMT), rS = an.sum(list, x => x.rcvMT);
    ws.set(t, 9, { f: `SUM(I5:I${last})`, v: C.round(dS, 3) }, tb({ numFmt: FMT.mt })); ws.set(t, 10, { f: `SUM(J5:J${last})`, v: C.round(rS, 3) }, tb({ numFmt: FMT.mt }));
    ws.set(t, 11, { f: `J${t}-I${t}`, v: C.round(rS - dS, 3) }, tb({ numFmt: FMT.diff })); ws.set(t, 12, { f: `IFERROR(K${t}/I${t},0)`, v: dS ? (rS - dS) / dS : 0 }, tb({ numFmt: FMT.pct }));
    ws.opts.autoFilter = `A4:P${Math.max(last, 5)}`;
  }

  // ---------- sheet 4: carry-forward trucks ----------
  function carryStatus(x, ctx) {
    if (x.billable) return { g: 3, text: `Received ${C.fmtDate(x.rcvEff)} – billed in ${x.billC.short}` };
    if (x.later) return { g: 2, text: `Received ${C.fmtDate(x.rcvDateActual)} (after period) – bills in ${x.billC.short}` };
    if (x.status === 'Accident Case') return { g: 1, text: 'Accident case – not received' };
    if (x.status === 'In Transit') return { g: 0, text: 'In transit – receipt awaited' };
    return { g: 0, text: 'Not received – receipt awaited' };
  }
  function sheetCarry(wb, an, ctx) {
    const ws = wb.addSheet('Carry Forward Trucks', { freeze: { row: 6, col: 2 }, showGridLines: false, tabColor: 'FFED7D31', zoom: 90 });
    title(ws, an, ctx, 'Trucks NOT received by the cycle end – carried forward to the cycle of receipt');
    const list = an.carryList.map(x => Object.assign({ st: carryStatus(x, ctx) }, x)).sort((a, b) => a.st.g - b.st.g || a.date - b.date || a.key.localeCompare(b.key));

<script>/* Dashboard UI */

  // ---------- receipt source mode ----------

  function tripRows(res) {

    const k = S.sort.k, d = S.sort.dir; const val = { date: r => r.date.getTime() * 1e5 + (r.time || 0) * 1e4, slip: r => r.key, transporter: r => r.transporter, disp: r => r.dispMT, rcv: r => r.rcvMT === null ? -1e9 : r.rcvMT, diff: r => r.diffMT === null ? 1e9 : r.diffMT, pct: r => r.diffPct === null ? 1e9 : r.diffPct, status: r => r.status }[k];

  function renderTrips() {

      const nr = r.rcvMT === null;
      h += `<tr class="${r.truckCheck === 'Mismatch' ? 'mm' : ''}"><td>${S.page * PS + i + 1}</td><td>${esc(r.slip)}${r.remark ? ` <span class="tag" title="${esc(r.remark)}">!</span>` : ''}</td><td>${C.fmtDate(r.date)} ${C.fmtTime(r.time)}</td><td>${esc(r.transporter)}</td><td>${esc(r.truckRFID)}</td><td>${r.truckCheck === 'Mismatch' ? `<span class="bdg bad">${esc(r.truckRcv)}</span>` : esc(r.truckRcv)}</td><td>${r.rcvDate ? C.fmtDate(r.rcvDate) : ''}</td>${rb ? `<td>${r.rcvDate ? (r.later ? 'Next: ' : '') + C.cycleOf(r.rcvDate).short : (nr ? 'Pending' : '')}</td>` : ''}<td class="r">${nf2.format(r.dispMT)}</td><td class="r">${nr ? '—' : nf2.format(r.rcvMT)}</td><td class="r ${!nr && r.diffMT < 0 ? 'neg' : ''}">${nr ? '' : nf2.format(r.diffMT)}</td><td class="r ${!nr && r.diffMT < 0 ? 'neg' : ''}">${nr ? '' : pct(r.diffPct)}</td>
        <td>${nr && !r.later ? `<select class="st" data-key="${esc(r.key)}">${['Not Received', 'Accident Case', 'In Transit'].map(o => `<option ${o === r.status ? 'selected' : ''}>${o}</option>`).join('')}</select>` : `<span class="bdg ${STATUS_CLASS[r.status]}">${r.status}</span>`}</td>${res.cross ? `<td class="r">${r.fileMT === null ? '' : nf2.format(r.fileMT)}</td><td>${r.fileCheck === 'Match' ? '<span class="bdg ok">Match</span>' : (r.fileCheck === 'N/A' || r.fileCheck === 'Outside file period' ? `<span class="hint">${esc(r.fileCheck)}</span>` : `<span class="bdg bad">${esc(r.fileCheck)}</span>`)}</td>` : ''}</tr>`;
    });
    if (!rows.length) h += `<tr><td colspan="13" class="hint" style="text-align:center;padding:24px">No trips match this filter.</td></tr>`;
    h += `</tbody></table></div><div class="pager"><span>${nf0.format(rows.length)} trips</span>${pages > 1 ? `<button data-pg="-1" ${S.page === 0 ? 'disabled' : ''}>‹ Prev</button><span>Page ${S.page + 1} / ${pages}</span><button data-pg="1" ${S.page >= pages - 1 ? 'disabled' : ''}>Next ›</button>` : ''}</div>`;
    $('#trips').innerHTML = h;
    document.querySelectorAll('[data-sort]').forEach(t => t.onclick = () => { S.sort = { k: t.dataset.sort, dir: S.sort.k === t.dataset.sort ? -S.sort.dir : 1 }; renderTrips(); });
    document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { S.page += +b.dataset.pg; renderTrips(); });
    document.querySelectorAll('select.st').forEach(sel => sel.onchange = () => { if (sel.value === 'Not Received') delete S.overrides[sel.dataset.key]; else S.overrides[sel.dataset.key] = sel.value; lsSet('recon.overrides', S.overrides); applyOverrides(); renderResults(); });
  }
  function bindResults() {
    if (!S.active || !S.results[S.active]) return;
    document.querySelectorAll('[data-tab]').forEach(t => t.onclick = () => { S.active = t.dataset.tab; S.filter = 'all'; S.transporter = ''; S.search = ''; S.page = 0; renderResults(); });
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; S.page = 0; renderResults(); });
    document.querySelectorAll('[data-tr]').forEach(r => r.onclick = (e) => { if (e.target.closest('[data-dl-tr]')) return; S.transporter = S.transporter === r.dataset.tr ? '' : r.dataset.tr; S.page = 0; renderResults(); });
    document.querySelectorAll('[data-dl-tr]').forEach(b => b.onclick = () => exportCustomer(S.active, { onlyTransporter: b.dataset.dlTr }));
    $('#q').oninput = e => { S.search = e.target.value; S.page = 0; renderTrips(); };
    $('#agent').onchange = e => { S.cust[S.active].agent = e.target.value.trim() || 'Receiver'; renderResults(); };
    $('#exp-one').onclick = () => exportCustomer(S.active);
    $('#exp-all').onclick = exportAll;
    $('#exp-cycle-one').onclick = () => exportCycleCustomer(S.active);
    $('#exp-bill-one').onclick = () => exportBillCustomer(S.active);
    $('#exp-bill-all').onclick = exportBillAll;
    $('#exp-cycle-all').onclick = exportCycleAll;
    const um = $('#show-um'); if (um) um.onclick = (e) => { e.preventDefault(); $('#um').scrollIntoView({ behavior: 'smooth' }); };
    renderTrips();
  }

  // ---------- export ----------
  const safe = (s) => String(s).replace(/[\\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  function download(name, bytes, mime) { const b = new Blob([bytes], { type: mime }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); }
  const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  function metaFor(customer, resIn) {
    const res = resIn || S.results[customer], cs = S.cust[customer]; const items = Array.from(new Set(res.rows.map(r => r.item))).join(' / ') || 'Salt';
    const dest = (res.rows.length && S.rfid.recs.find(r => r.key === res.rows[0].key).destination) || 'Kandla Port';
    return { plantLabel: S.settings.plantLabel[S.plant] || C.customerShort(S.plant), destination: dest, itemLabel: items, from: S.from, to: S.to, agent: cs.agent, thresholdPct: S.settings.thresholdPct, receipts: res.mode === 'rfid' ? null : cs.receipts, rfidRows: C.filterRFID(S.rfid, filt()) };
  }
  const stamp = () => `${C.isoDate(S.from)}_to_${C.isoDate(S.to)}`;
  // Short file names: Windows "Extract all" fails (error 0x80010135, path too long) when folder + file names pass ~260 characters.
  const dShort = (iso) => { const d = C.parseDate(iso); return String(d.getUTCDate()).padStart(2, '0') + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()] + String(d.getUTCFullYear()).slice(2); };
  const stampS = () => `${dShort(C.isoDate(S.from))}-${dShort(C.isoDate(S.to))}`;
  const trunc = (t, n) => { t = safe(t); return t.length <= n ? t : t.slice(0, n).trim(); };
  const uniqName = (name, used) => { let n = name, k = 2; const ext = name.replace(/^.*(\.[^.]+)$/, '$1'), stem = name.slice(0, name.length - ext.length); while (used.has(n.toLowerCase())) n = stem + ' (' + (k++) + ')' + ext; used.add(n.toLowerCase()); return n; };
  async function buildFiles(customer, only) {
    const res = S.results[customer], meta = metaFor(customer), cShort = trunc(C.customerShort(customer), 31), pShort = trunc(meta.plantLabel, 12);
    const base = `${cShort} - ${pShort} - ${stampS()}`; const files = [], used = new Set();
    if (only && only.onlyTransporter) { files.push({ name: `${base} - ${trunc(only.onlyTransporter, 30)}.xlsx`, data: await ReconExport.buildWorkbook(res, meta, { onlyTransporter: only.onlyTransporter, includeSource: S.settings.includeSource }) }); return files; }
    files.push({ name: uniqName(`${base}.xlsx`, used), data: await ReconExport.buildWorkbook(res, meta, { transporterSheets: S.settings.transporterSheets, includeSource: S.settings.includeSource }) });
    if (S.settings.splitTransporters) for (const t of res.stats.transporters) files.push({ name: uniqName(`${trunc(t.name, 30)} - ${stampS()}.xlsx`, used), data: await ReconExport.buildWorkbook(res, meta, { onlyTransporter: t.name, includeSource: S.settings.includeSource }) });
    return files;
  }
  async function exportCustomer(customer, only) {
    try {
      setBusy('Building Excel…'); await new Promise(r => setTimeout(r, 30)); const files = await buildFiles(customer, only);
      if (files.length === 1) download(files[0].name, files[0].data, XLSX_MIME);
      else { const z = new JSZip(); files.forEach(f => z.file(f.name, f.data)); download(`${trunc(C.customerShort(customer), 31)} - ${trunc(metaFor(customer).plantLabel, 12)} - ${stampS()}.zip`, await z.generateAsync({ type: 'uint8array' }), 'application/zip'); }
    } catch (e) { console.error(e); toast('Export failed: ' + e.message, 'err'); } finally { setBusy(''); }
  }
  async function exportAll() {
    const keys = Object.keys(S.results); if (keys.length === 1) return exportCustomer(keys[0]);
    try {
      setBusy('Building Excel files…'); await new Promise(r => setTimeout(r, 30)); const z = new JSZip(), folders = new Set();
      for (const k of keys) { const fs = await buildFiles(k); const folder = uniqName(trunc(C.customerShort(k), 31), folders); fs.forEach(f => z.file(`${folder}/${f.name}`, f.data)); }
      download(`Reconciliation - ${trunc(S.settings.plantLabel[S.plant] || C.customerShort(S.plant), 12)} - ${stampS()}.zip`, await z.generateAsync({ type: 'uint8array' }), 'application/zip');
    } catch (e) { console.error(e); toast('Export failed: ' + e.message, 'err'); } finally { setBusy(''); }
  }
  async function exportCycleCustomer(customer) {
    try {
      setBusy('Building Daily Cycle Excel…'); await new Promise(r => setTimeout(r, 30));
      const res = S.results[customer], meta = metaFor(customer);
      const data = await DailyCycleExport.buildWorkbook(res, meta);
      const fname = `${trunc(C.customerShort(customer), 31)} - ${trunc(meta.plantLabel, 12)} - Daily Cycle - ${stampS()}.xlsx`;
      download(fname, data, XLSX_MIME);
    } catch (e) { console.error(e); toast('Daily Cycle export failed: ' + e.message, 'err'); } finally { setBusy(''); }
  }
  async function exportCycleAll() {
    const keys = Object.keys(S.results); if (keys.length === 1) return exportCycleCustomer(keys[0]);
    try {
      setBusy('Building Daily Cycle Excel files…'); await new Promise(r => setTimeout(r, 30));
      const z = new JSZip(), used = new Set();
      for (const k of keys) {
        const res = S.results[k], meta = metaFor(k);
        const data = await DailyCycleExport.buildWorkbook(res, meta);
        const fname = uniqName(`${trunc(C.customerShort(k), 31)} - ${trunc(meta.plantLabel, 12)} - Daily Cycle - ${stampS()}.xlsx`, used);
        z.file(fname, data);
      }
      download(`Daily Cycle - ${trunc(S.settings.plantLabel[S.plant] || C.customerShort(S.plant), 12)} - ${stampS()}.zip`, await z.generateAsync({ type: 'uint8array' }), 'application/zip');
    } catch (e) { console.error(e); toast('Daily Cycle export failed: ' + e.message, 'err'); } finally { setBusy(''); }
  }

  // Billing Cycle workbook is always built on the receipt-date basis for the selected From/To (independent of the on-screen basis).
  function billingResult(customer) {
    const cs = S.cust[customer]; const m = effMode(customer);
    return C.reconcileCustomer(S.rfid, Object.assign({}, filt(), { basis: 'receipt' }), customer, cs && cs.receipts, { thresholdPct: S.settings.thresholdPct, overrides: S.overrides, mode: m });
  }
  async function billingBytes(customer) { const res = billingResult(customer); return BillingCycleExport.buildWorkbook(res, metaFor(customer, res)); }
  async function exportBillCustomer(customer) {
    try {
      setBusy('Building Billing Cycle Excel…'); await new Promise(r => setTimeout(r, 30));
      const data = await billingBytes(customer);
      download(`${trunc(C.customerShort(customer), 31)} - ${trunc(metaFor(customer).plantLabel, 12)} - Billing Cycle - ${stampS()}.xlsx`, data, XLSX_MIME);
    } catch (e) { console.error(e); toast('Billing Cycle export failed: ' + e.message, 'err'); } finally { setBusy(''); }
  }
  async function exportBillAll() {
    const keys = Object.keys(S.results); if (keys.length === 1) return exportBillCustomer(keys[0]);
    try {
      setBusy('Building Billing Cycle Excel files…'); await new Promise(r => setTimeout(r, 30));
      const z = new JSZip(), used = new Set();
      for (const k of keys) { const data = await billingBytes(k); z.file(uniqName(`${trunc(C.customerShort(k), 31)} - ${trunc(metaFor(k).plantLabel, 12)} - Billing Cycle - ${stampS()}.xlsx`, used), data); }
      download(`Billing Cycle - ${trunc(S.settings.plantLabel[S.plant] || C.customerShort(S.plant), 12)} - ${stampS()}.zip`, await z.generateAsync({ type: 'uint8array' }), 'application/zip');
    } catch (e) { console.error(e); toast('Billing Cycle export failed: ' + e.message, 'err'); } finally { setBusy(''); }
  }

  function renderAll() { renderSidebar(); renderResults(); }
  window.addEventListener('DOMContentLoaded', () => { renderAll(); window.__recon = { S, loadRFID, loadReceipts, loadReceipt: (c, f) => loadReceipts(c, [f], false), billingBytes, billingResult }; });
})();
</script>
</body>
